name: 中英同步状态

# 中文是真源，英文是译本。这个流程只把"英文欠了多少"报出来，
# 不阻断任何提交——硬阻断会拖累中文迭代，而一旦有人开始绕过检查，机制就没用了。

on:
  push:
    paths:
      - "references/**"
      - "SKILL.md"
      - "tools/check-sync.py"
  pull_request:
    paths:
      - "references/**"
      - "SKILL.md"
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 生成同步状态表
        run: python3 tools/check-sync.py --write

      - name: 写进任务摘要
        run: cat SYNC-STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: 有变化就提交回去
        if: github.event_name == 'push'
        run: |
          if [[ -n "$(git status --porcelain SYNC-STATUS.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add SYNC-STATUS.md
            git commit -m "chore: 更新中英同步状态"
            git push
          else
            echo "同步状态没变化"
          fi
